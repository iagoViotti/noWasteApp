version: '3'
services:
  frontend:
    container_name: nwapp_frontend
    build: frontend/
    restart: on-failure
    ports:
      - 5173:5173
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "lsof", "-t", "-i:5173" ] # Caso utilize outra porta interna para o front, altere ela aqui também
      timeout: 10s
      retries: 5
  backend:
    container_name: nwapp_backend
    build: backend/
    restart: on-failure
    ports:
      - 3010:3010
    working_dir: /backend
    volumes:
      - ./backend:/backend
    environment:
      - DB_USER=root
      - DB_PASS=123456
      - DB_HOST=database
      - DB_PORT=3306 - BASE_URL=http://localhost:3010 
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "lsof", "-t", "-i:3010" ] # Caso utilize outra porta interna para o front, altere ela aqui também
      timeout: 10s
      retries: 5
  database:
    image: mysql:8.0.32
    container_name: db
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ] # Deve aguardar o banco ficar operacional
      timeout: 10s
      retries: 5
    cap_add:
      - SYS_NICE # Deve omitir alertas menores
